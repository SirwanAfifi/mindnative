name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build app and test bundles
        run: >-
          xcodebuild
          -project MindNative.xcodeproj
          -scheme MindNative
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run unit tests
        run: >-
          xcodebuild
          -project MindNative.xcodeproj
          -scheme MindNative
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          -only-testing:MindNativeTests
          test-without-building

      - name: Run UI smoke tests
        run: >-
          xcodebuild
          -project MindNative.xcodeproj
          -scheme MindNative
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          -only-testing:MindNativeUITests
          test-without-building

      - name: Analyze
        run: >-
          xcodebuild
          -project MindNative.xcodeproj
          -scheme MindNative
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          analyze

      - name: Build universal Release
        run: >-
          xcodebuild
          -project MindNative.xcodeproj
          -scheme MindNative
          -configuration Release
          -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          build
